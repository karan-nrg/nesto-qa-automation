name: Playwright

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run live EN+FR E2E (creates up to 2 QA accounts)'
        type: boolean
        default: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  e2e:
    name: Live E2E (chromium-en + chromium-fr)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium only
        run: npx playwright install --with-deps chromium
      - name: Run EN + FR projects
        # ACCOUNT CAP: suite may create at most 2 accounts (EN success + FR success).
        # Duplicate coverage reuses one of those emails. See ASSUMPTIONS.md.
        run: npx playwright test --project=chromium-en --project=chromium-fr
      - name: Upload report (may contain secrets — keep private)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
        # Do not publish traces publicly; artifact retention is short and private to the repo.
