name: Playwright

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run sign up flow both English and French'
        type: boolean
        default: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn format:check
      - run: yarn lint
      - run: yarn typecheck

  # Runs only when you click "Run workflow" and leave run_e2e checked.
  # Skipped on push/PR so we don't create QA accounts from every commit.
  # Reports and traces stay on the runner (they can hold tokens/passwords)
  # and are never uploaded as artifacts.
  e2e:
    name: Sign Up E2E (english and french)
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Install Chromium only
        run: yarn playwright install --with-deps chromium
      - name: Run EN + FR projects
        run: yarn playwright test --project=chromium-en --project=chromium-fr
