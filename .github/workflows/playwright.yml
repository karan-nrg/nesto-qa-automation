name: Playwright

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run sign up flow both English and French'
        type: boolean
        default: true
      test_file:
        description: 'Optional Playwright path (e.g. tests/signup/fields.spec.ts). Leave empty for the full suite.'
        type: string
        default: ''
      project:
        description: 'Which Playwright project(s) to run'
        type: choice
        options:
          - both
          - chromium-en
          - chromium-fr
        default: both

# One Pages deploy at a time; do not cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn format:check
      - run: yarn lint
      - run: yarn typecheck

  # Runs only when you click "Run workflow" and leave run_e2e checked.
  # Skipped on push/PR so we don't create QA accounts from every commit.
  e2e:
    name: Sign Up E2E (english and french)
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Install Chromium only
        run: yarn playwright install --with-deps chromium
      - name: Run Playwright
        run: |
          set -euo pipefail
          PROJECT_ARGS=()
          if [ "${{ inputs.project }}" = "both" ]; then
            PROJECT_ARGS=(--project=chromium-en --project=chromium-fr)
          else
            PROJECT_ARGS=(--project=${{ inputs.project }})
          fi

          if [ -n "${{ inputs.test_file }}" ]; then
            yarn playwright test "${{ inputs.test_file }}" "${PROJECT_ARGS[@]}"
          else
            yarn playwright test "${PROJECT_ARGS[@]}"
          fi
      # Green runs: HTML report only (no test-results / traces) for GitHub Pages.
      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report
      # Failures: keep traces/screenshots as a short-lived downloadable artifact.
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Publishes the latest green HTML report to GitHub Pages.
  # Enable Pages in the repo: Settings → Pages → Source: GitHub Actions.
  deploy-report:
    name: Deploy HTML report to Pages
    if: success()
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
